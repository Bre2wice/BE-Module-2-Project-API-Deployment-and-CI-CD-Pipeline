name: Flask CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3️⃣ Install dependencies (no venv needed in GitHub Actions)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Run database setup (safe even if using SQLite)
      - name: Initialize database
        run: |
          flask db upgrade || echo "No migrations to apply"
        env:
          FLASK_APP: run.py
          FLASK_ENV: testing

      # 5️⃣ Run unit tests
      - name: Run tests
        run: |
          python -m unittest discover tests

      # 6️⃣ Debug info (optional but helpful)
      - name: Print debugging information
        run: |
          echo "Python Version:"
          python --version
          echo "Working Directory:"
          pwd
          echo "Project Files:"
          ls -la
